name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Cek
      uses: actions/checkout@v4

    - name: Spec Dosyasına Sabit NDK Ayarı Bas
      run: |
        sed -i 's/^p4a.branch =.*/p4a.branch = v2024.01.21/' buildozer.spec || true
        sed -i 's/^android.ndk =.*/android.ndk = 25b/' buildozer.spec || true

    - name: Docker İçinde APK Derle
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        options: -v ${{ github.workspace }}:/home/user/hostpython
        run: |
          cd /home/user/hostpython
          buildozer -v android debug

    - name: APK Hazırla
      run: |
        mkdir -p output_apk
        cp bin/*.apk output_apk/ 2>/dev/null || true

    - name: APK Yukle
      uses: actions/upload-artifact@v4
      with:
        name: bist-app-apk
        path: output_apk/
