name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Çek
      uses: actions/checkout@v4

    - name: Docker İçinde APK Derle
      run: |
        docker run --rm \
          -v ${{ github.workspace }}:/home/user/hostpython \
          kivy/buildozer buildozer -v android debug

    - name: APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: bist-app-apk
        path: bin/*.apk
