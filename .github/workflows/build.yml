name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Kodu Cek
      uses: actions/checkout@v4

    - name: Python ve Sistem Paketlerini Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential git ccache libffi-dev libssl-dev libtool autoconf automake gettext zlib1g-dev libltdl-dev pkg-config openjdk-17-jdk zip unzip python3-pip python3-setuptools wget
        python3 -m pip install --upgrade pip
        python3 -m pip install "cython<3.0.0" "buildozer==1.5.0"

    - name: Android SDK ve Cmdline-Tools Kur (sdkmanager Düzeltmesi)
      run: |
        # SDK ve cmdline-tools dizinlerini oluştur
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses

        # Resmi Android Command Line Tools indir
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
        rm -rf cmdline-tools cmdline-tools.zip

        # sdkmanager sembolik bağlantısını eski Buildozer yapısına uygun konuma bağla
        ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

        # Lisansları kabul et
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Spec Dosyasında NDK 25b Sabitle
      run: |
        sed -i 's/^android.ndk =.*/android.ndk = 25b/' buildozer.spec || true
        sed -i 's/^p4a.branch =.*/p4a.branch = release-2023.05.21/' buildozer.spec || true

    - name: APK Derle
      run: |
        buildozer -v android debug

    - name: APK Hazırla
      run: |
        mkdir -p output_apk
        cp bin/*.apk output_apk/ 2>/dev/null || true

    - name: APK Yukle
      uses: actions/upload-artifact@v4
      with:
        name: bist-app-apk
        path: output_apk/
