name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Cek
      run: |
        git clone https://github.com/${{ github.repository }}.git .
        git checkout ${{ github.sha }}

    - name: Spec Dosyasını Düzenle (Root Uyarısı ve NDK Sabitleme)
      run: |
        sed -i 's/^p4a.branch =.*/p4a.branch = v2024.01.21/' buildozer.spec || true
        sed -i 's/^android.ndk =.*/android.ndk = 25b/' buildozer.spec || true
        sed -i 's/^warn_on_root =.*/warn_on_root = 0/' buildozer.spec || true
        grep -q "warn_on_root" buildozer.spec || echo -e "\nwarn_on_root = 0" >> buildozer.spec

    - name: Docker İçinde APK Derle
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        options: -v ${{ github.workspace }}:/home/user/hostpython
        run: |
          cd /home/user/hostpython
          
          # Lisansları otomatik kabul et
          mkdir -p /root/.buildozer/android/platform/android-sdk/licenses
          echo -e "\n24333735771d99dcd2263d239e0713700a7b2b57\n89330822745758060100d856419e609a24131121\n7a93463f0350b413a3a99edba758211091690e0b\n832544e9d38d0119a8f80c341825a0433e547374\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333735771d99dcd2263d239e0713700a7b2b57" > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          
          # Derlemeyi başlat
          buildozer -v android debug

    - name: APK Hazırla
      run: |
        mkdir -p output_apk
        cp bin/*.apk output_apk/ 2>/dev/null || true

    - name: APK Yukle
      uses: actions/upload-artifact@v4
      with:
        name: bist-app-apk
        path: output_apk/
